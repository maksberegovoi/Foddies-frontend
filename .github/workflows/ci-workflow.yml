name: CI workflow

on:
  pull_request:
    branches: ["dev", "main"]
    paths-ignore:
      - "*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Generate api types
        run: |
          echo "💡 Hint: if this fails try to check the 'target' field in 'orval.config.cjs' there must be the deployed api url, not localhost "
          npm run generate-api

      - name: Typecheck
        run: |
          echo "💡 Hint:  if this check fails try to regenerate the api types with 'npm run generate-api'"
          npm run typecheck

      #      - name: Unit tests
      #        run: npm test

      - name: Build
        run: npm run build
